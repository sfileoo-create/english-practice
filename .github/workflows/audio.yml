name: Озвучка фраз

on:
  push:
    branches: [main]
    paths:
      - 'exercises.js'
      - 'tools/**'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Кэш модели голоса
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-onnx-v1.0

      - name: Скачать модель голоса (Kokoro)
        run: |
          mkdir -p models
          cd models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -s voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin $base/voices-v1.0.bin
          ls -la

      - name: Установить программы
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile

      - name: Собрать фразы
        run: node tools/collect_texts.js > texts.json && python -c "import json;print(len(json.load(open('texts.json'))),'texts')"

      - name: Озвучить
        run: python tools/generate_audio.py texts.json

      - name: Сохранить записи в репозиторий
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Обновить озвучку"
            git push
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          fi
